services:
  postgres:
    image: postgres:16-alpine
    container_name: tcc_produtividade_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-produtividade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-produtividade_secret}
      POSTGRES_DB: ${POSTGRES_DB:-produtividade_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-produtividade} -d ${POSTGRES_DB:-produtividade_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: tcc_produtividade_mail
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP para RF04 (Reset de senha)
      - "8025:8025" # Interface Web para visualizar e-mails em dev/banca

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tcc_produtividade_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-produtividade}:${POSTGRES_PASSWORD:-produtividade_secret}@postgres:5432/${POSTGRES_DB:-produtividade_db}?schema=public
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
